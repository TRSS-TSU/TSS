  <rect x="104" y="170" width="188" height="50" rx="5" fill="#e6f4f1" stroke="#99d5ca"/>
  <text x="124" y="202" fill="#0f766e" font-family="Arial" font-size="20" font-weight="700">Starter Player</text>
  <rect x="390" y="74" width="438" height="392" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
