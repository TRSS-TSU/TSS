<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">Starter Player Animator assignment</title>
  <desc id="desc">Starter Player inspector with an Animator component using the override controller and Apply Root Motion off.</desc>
  <rect width="900" height="540" fill="#f8fafc"/>
  <rect x="72" y="74" width="256" height="392" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
